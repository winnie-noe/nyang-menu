<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>메뉴냥</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one pink chat.exe window on a dotted sparkle field. Cat stage on top, chat log in the middle, a 2x2 choice pad below. */
:root{
  --field:#f8d3df; --field-dot:#fce6ee;
  --win:#ffe3ed; --panel:#fff8fb; --cream:#fffaf5;
  --line:#86425f; --ink:#6e3452; --muted:#b4728f;
  --pink:#f7a9c4; --pink-2:#ffd2e1; --deep:#d9668f;
  --f-latin:"Pixelify Sans","Jua",ui-monospace,monospace;
  --f-ko:"Jua","Pixelify Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--field);
  background-image:radial-gradient(var(--field-dot) 2px,transparent 2.5px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-ko);
  display:flex; justify-content:center; align-items:flex-start;
  padding-block:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
.decor{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.decor i{position:absolute; width:22px; height:22px; opacity:.9}
.decor i svg{width:100%; height:100%; display:block}

.win{
  position:relative; z-index:1; width:100%; max-width:420px;
  background:var(--win); border:4px solid var(--line); border-radius:16px;
  box-shadow:6px 6px 0 rgba(134,66,95,.22);
  padding:10px; display:flex; flex-direction:column; gap:8px;
}
.titlebar{display:flex; align-items:center; gap:8px; padding:2px 4px 0}
.titlebar .mini{width:34px; height:34px; flex:none}
.titlebar h1{font-family:var(--f-latin); font-weight:600; font-size:26px; margin:0; flex:1; letter-spacing:.5px; color:var(--ink)}
.wbtns{display:flex; gap:4px}
.wbtn{width:26px; height:26px; border:3px solid var(--line); border-radius:6px; background:var(--pink-2);
  display:grid; place-items:center; font-family:var(--f-latin); font-size:14px; line-height:1; color:var(--line)}
.status{border:3px solid var(--line); border-radius:10px; background:var(--panel); padding:6px 10px;
  font-family:var(--f-latin); font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px}
.status .on{width:8px; height:8px; background:#8fd49b; border:2px solid var(--line)}
.status b{color:var(--ink); font-family:var(--f-ko); font-weight:400}

.screen{border:3px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden; display:flex; flex-direction:column}
.stage{position:relative; height:262px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:12px;
  border-bottom:3px dashed var(--pink);
  background:linear-gradient(transparent 70%, var(--pink-2) 70%, var(--pink-2) 100%)}
.catbtn{border:0; background:none; padding:0; cursor:pointer; width:132px; position:relative; z-index:1}
.catbtn:focus-visible{outline:3px dashed var(--deep); outline-offset:4px; border-radius:8px}
.catbtn svg{width:100%; display:block; animation:bob 2.4s steps(2) infinite}
.thinking .catbtn svg{animation:sway 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes sway{0%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}

.cloud{position:absolute; top:12px; left:50%; transform:translateX(-50%); width:max-content; min-width:190px; max-width:88%;
  background:var(--cream); border:3px solid var(--line); border-radius:24px; padding:8px 16px 10px; text-align:center; z-index:2}
.cloud::before,.cloud::after{content:""; position:absolute; background:var(--cream); border:3px solid var(--line); border-radius:50%}
.cloud::before{width:14px; height:14px; bottom:-20px; left:calc(50% + 34px)}
.cloud::after{width:9px; height:9px; bottom:-33px; left:calc(50% + 46px)}
.cloud .sub{font-size:13px; color:var(--muted); min-height:1.2em}
.cloud .main{font-size:23px; color:var(--ink); line-height:1.25; min-height:1.25em}
.thinking .cloud .main{color:var(--deep)}
.bar{display:flex; gap:3px; justify-content:center; margin-top:6px}
.bar span{width:12px; height:8px; border:2px solid var(--line); background:var(--panel)}
.bar span.on{background:var(--deep)}

.spark{position:absolute; width:10px; height:10px; pointer-events:none; z-index:3}
.spark::before,.spark::after{content:""; position:absolute; background:var(--deep)}
.spark::before{left:4px; top:0; width:2px; height:10px}
.spark::after{top:4px; left:0; width:10px; height:2px}
@keyframes pop{0%{opacity:0; transform:scale(.3)}40%{opacity:1; transform:scale(1.3)}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.6)}}

.log{height:248px; overflow-y:auto; padding:14px 12px 16px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth}
.msg{max-width:80%; padding:9px 13px; border:3px solid var(--line); border-radius:14px; font-size:16px; line-height:1.45; position:relative; animation:in .18s steps(3)}
.msg::after{content:""; position:absolute; width:11px; height:11px; bottom:-8px; background:inherit;
  border-right:3px solid var(--line); border-bottom:3px solid var(--line); transform:rotate(45deg)}
.msg.cat{align-self:flex-start; background:var(--pink); color:var(--ink)}
.msg.cat::after{left:16px}
.msg.me{align-self:flex-end; background:var(--cream); color:var(--deep)}
.msg.me::after{right:16px}
@keyframes in{from{transform:translateY(6px); opacity:0}}
.typing{display:flex; gap:5px; padding:13px 14px}
.typing i{width:7px; height:7px; background:var(--line); animation:blinkdot .9s steps(2) infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blinkdot{50%{opacity:.25}}

.result{display:flex; flex-direction:column; gap:4px; min-width:200px}
.result .eyebrow{font-family:var(--f-latin); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--line); opacity:.8}
.result strong{font-weight:400; font-size:30px; color:var(--ink); text-shadow:2px 2px 0 var(--cream); line-height:1.2}
.result p{margin:2px 0 4px}
.result .meta{display:flex; gap:6px; flex-wrap:wrap; font-size:13px}
.result .meta span{background:var(--cream); border:2px solid var(--line); border-radius:6px; padding:1px 7px}

.pad{padding:12px; border-top:3px solid var(--line); background:var(--win); display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pad[hidden],.confirm[hidden],.host[hidden],.screen[hidden]{display:none!important}
.pbtn{font-family:var(--f-ko); color:var(--ink); border:3px solid var(--line); border-radius:12px; background:var(--cream);
  padding:9px 10px; cursor:pointer; box-shadow:0 4px 0 var(--line); display:flex; align-items:center; gap:10px; text-align:left;
  transition:transform .06s, box-shadow .06s; min-width:0}
.pbtn:hover{background:var(--pink-2)}
.pbtn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.pbtn:focus-visible{outline:3px dashed var(--deep); outline-offset:2px}
.pbtn .ico{width:32px; height:32px; flex:none}
.pbtn .ico svg{width:100%; height:100%; display:block}
.pbtn b{display:block; font-weight:400; font-size:20px; line-height:1.1}
.pbtn small{display:block; font-size:12px; color:var(--muted)}
.pbtn.span2{grid-column:1 / -1; justify-content:center}
.pbtn b,.pbtn small,.pbtn.wide{word-break:keep-all}
.pad.soup .pbtn b{font-size:17px}
.pad.soup .pbtn .ico{width:26px; height:26px}
.pbtn.wide{justify-content:center; text-align:center; font-size:16px}
.pbtn.alt{background:var(--pink)}
.pbtn.alt:hover{background:var(--pink-2)}

.inputbar{display:flex; gap:6px; align-items:center}
.fake{flex:1; min-width:0; border:3px solid var(--line); border-radius:10px; background:var(--panel); padding:7px 10px;
  font-family:var(--f-latin); font-size:15px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ibtn{width:38px; height:38px; border:3px solid var(--line); border-radius:10px; background:var(--pink-2); cursor:pointer; padding:5px; flex:none}
.ibtn:hover{background:var(--pink)}
.ibtn:focus-visible{outline:3px dashed var(--deep); outline-offset:2px}
.ibtn svg{width:100%; height:100%; display:block}
.foot{text-align:center; font-family:var(--f-latin); font-size:12px; color:var(--muted); padding-top:2px}

.hostbtn{font-family:var(--f-latin); font-size:14px; color:var(--panel); background:var(--deep); border:3px solid var(--line);
  border-radius:8px; padding:2px 9px; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.hostbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.hostbtn[aria-pressed="true"]{background:var(--ink)}
.hostbtn:focus-visible,.mini-btn:focus-visible,.addbtn:focus-visible,.tab:focus-visible{outline:3px dashed var(--deep); outline-offset:2px}

.host{border:3px solid var(--line); border-radius:12px; background:var(--panel); padding:12px; display:flex; flex-direction:column; gap:10px}
.host-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.host-head b{font-family:var(--f-latin); font-weight:600; font-size:20px; color:var(--ink)}
.host-head small{font-size:13px; color:var(--muted)}
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.tab{font-family:var(--f-ko); font-size:16px; color:var(--ink); background:var(--cream); border:3px solid var(--line); border-radius:10px;
  padding:5px 0; cursor:pointer}
.tab small{font-family:var(--f-latin); font-size:11px; color:var(--muted); margin-left:2px}
.tab[aria-selected="true"]{background:var(--pink)}
.rows{display:flex; flex-direction:column; gap:8px; max-height:380px; overflow-y:auto; padding-right:2px}
.row{border:2px solid var(--line); border-radius:10px; background:var(--cream); padding:7px; display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto; gap:6px; align-items:center}
.souptg{display:flex; align-items:center; gap:3px; font-size:13px; color:var(--ink); cursor:pointer; white-space:nowrap}
.souptg input{width:16px; height:16px; accent-color:var(--deep); margin:0}
.tab-info{margin:-2px 0 0; font-size:13px; color:var(--muted)}
.row input,.row select{font-family:var(--f-ko); font-size:15px; color:var(--ink); background:var(--panel); border:2px solid var(--pink);
  border-radius:7px; padding:5px 7px; min-width:0; width:100%}
.row input:focus,.row select:focus{outline:none; border-color:var(--deep)}
.row .line{grid-column:1 / -1; font-size:13px}
.row select{width:auto}
.del{width:30px; height:30px; border:2px solid var(--line); border-radius:7px; background:var(--pink-2); color:var(--line);
  font-family:var(--f-latin); font-size:16px; cursor:pointer; line-height:1}
.del:hover{background:var(--pink)}
.addbtn{font-family:var(--f-ko); font-size:15px; color:var(--deep); background:transparent; border:3px dashed var(--pink);
  border-radius:10px; padding:8px; cursor:pointer}
.addbtn:hover{background:var(--pink-2)}
.confirm{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; background:var(--pink-2);
  border:2px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px}
.confirm div{display:flex; gap:6px}
.host-note{margin:0; font-size:13px; color:var(--deep); min-height:1.2em}
.host-actions{display:flex; gap:6px; align-items:center}
.host-actions .grow{flex:1}
.mini-btn{font-family:var(--f-ko); font-size:15px; color:var(--panel); background:var(--deep); border:3px solid var(--line); border-radius:10px;
  padding:6px 14px; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.mini-btn.ghost{background:var(--cream); color:var(--ink)}
.mini-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.mini-btn:disabled{opacity:.5; cursor:default}

@media (max-width:380px){ .pbtn b{font-size:18px} .pbtn .ico{width:26px;height:26px} .log{height:220px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important; scroll-behavior:auto!important} }
</style>

<div class="decor" id="decor" aria-hidden="true"></div>

<main class="win" id="win">
  <div class="titlebar">
    <span class="mini" id="miniCat"></span>
    <h1>menu.exe</h1>
    <button class="hostbtn" id="hostBtn" type="button" hidden>host</button>
    <div class="wbtns" aria-hidden="true"><span class="wbtn">–</span><span class="wbtn">□</span><span class="wbtn">×</span></div>
  </div>
  <div class="status"><span class="on"></span><b>모찌</b> • online now • ♥</div>

  <section class="host" id="host" hidden aria-label="Host control">
    <div class="host-head">
      <b>host control</b>
      <small>모찌가 추천할 메뉴를 고쳐요</small>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="tab-info" id="tabInfo"></p>
    <div class="rows" id="rows"></div>
    <button class="addbtn" id="addBtn" type="button">+ 메뉴 추가</button>
    <div class="confirm" id="confirm" hidden>
      <span>이 종류를 처음 기본 메뉴로 되돌릴까요?</span>
      <div><button class="mini-btn" id="resetYes" type="button">되돌리기</button><button class="mini-btn ghost" id="resetNo" type="button">취소</button></div>
    </div>
    <p class="host-note" id="hostNote" role="status"></p>
    <div class="host-actions">
      <button class="mini-btn ghost" id="resetBtn" type="button">기본값</button>
      <span class="grow"></span>
      <button class="mini-btn ghost" id="closeBtn" type="button">닫기</button>
      <button class="mini-btn" id="saveBtn" type="button">저장</button>
    </div>
  </section>

  <section class="screen" id="screen">
    <div class="stage" id="stage">
      <div class="cloud" id="cloud" aria-live="polite">
        <div class="sub" id="cloudSub">(배고프다…)</div>
        <div class="main" id="cloudMain">뭐 먹을래?</div>
        <div class="bar" id="bar" hidden></div>
      </div>
      <button class="catbtn" id="cat" type="button" aria-label="모찌 쓰다듬기"></button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="pad" id="pad" hidden></div>
  </section>

  <div class="inputbar">
    <div class="fake" id="fake">&gt; 뭐 먹지…</div>
    <button class="ibtn" id="flowerBtn" type="button" aria-label="처음부터 다시"></button>
    <button class="ibtn" id="heartBtn" type="button" aria-label="모찌에게 하트 보내기"></button>
  </div>
  <div class="foot">tap the cat to pet her ♥</div>
</main>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 120) : ms));
const $ = id => document.getElementById(id);

/* ---------- pixel renderer ---------- */
function px(map, pal){
  const h = map.length, w = map[0].length; let r = '';
  map.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[ch]}"/>`; }));
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${r}</svg>`;
}
const CATPAL = {o:'#86425f', w:'#fffaf5', p:'#ffb0c8', E:'#4a2338', n:'#ff7aa2', b:'#e2709a'};
const EYES = {
  open:   ['owwwEEwwwwwwwwEEwwwo','owwwEEwwwwwwwwEEwwwo'],
  closed: ['owwwwwwwwwwwwwwwwwwo','owwEEEwwwwwwwwEEEwwo'],
  happy:  ['owwwEEwwwwwwwwEEwwwo','owwEwwEwwwwwwEwwEwwo'],
};
function catMap(eyes){
  return [
    '...oo..........oo...',
    '..owpo........opwo..',
    '..owppo......oppwo..',
    '.owwwwoooooooowwwwo.',
    '.owwwwwwwwwwwwwwbbo.',
    'owwwwwwwwwwwwwwwbbwo',
    EYES[eyes][0], EYES[eyes][1],
    'owppwwwwwnnwwwwwppwo',
    'owwwwwwwowwowwwwwwwo',
    'owwwwwwwwoowwwwwwwwo',
    '.owwwwwwwwwwwwwwwwo.',
    '..oowwwwwwwwwwwwoo..',
    '....oooooooooooo....',
    '...owwwwwwwwwwwwo...',
    '..owwwwwwwwwwwwwwo..',
    '..owwwowwwwwwowwwo..',
    '..oooooooooooooooo..',
  ];
}
const ICONS = {
  kor: px(['...wwww...','.wwwwwwww.','oooooooooo','.oppppppo.','..oppppo..','...oooo...'],
          {w:'#fffdf8', o:'#86425f', p:'#f7a9c4'}),
  wes: px(['cccccccccc','.oyyryyyo.','..oyyyyo..','...oryo...','....oo....'],
          {c:'#e9b46a', o:'#86425f', y:'#ffd36b', r:'#e8545f'}),
  jpn: px(['..ssssss..','.sSsSsSss.','.wwwwwwww.','.wwwwwwww.','..oooooo..'],
          {s:'#ff9a6b', S:'#ffd0b5', w:'#fffdf8', o:'#86425f'}),
  chn: px(['...o..o...','..o....o..','oooooooooo','.owwwwwwo.','.owwrrwwo.','..owwwwo..','..oooooo..'],
          {o:'#86425f', w:'#fffdf8', r:'#e8545f'}),
};
const FLOWER = px(['..p.p..','.ppppp.','ppyyypp','.pyyyp.','ppyyypp','.ppppp.','..p.p..'], {p:'#f7a9c4', y:'#ffd36b'});
const HEART  = px(['.oo.oo.','oppoppo','oppppp o'.replace(' ',''),'.opppo.','..opo..','...o...'], {o:'#86425f', p:'#e2709a'});
const SOUPICON = px(['.w..w..w..','..w..w..w.','oooooooooo','.obbbbbbo.','..obbbbo..','...oooo...'],
          {w:'#ffffff', o:'#86425f', b:'#ffb37a'});
const PLATEICON = px(['..........','...yyyy...','..yyrryy..','oooooooooo','.oppppppo.','..oooooo..'],
          {o:'#86425f', y:'#ffd36b', r:'#e8545f', p:'#f7a9c4'});
const SPARK  = px(['...o...','...o...','..ooo..','ooooooo','..ooo..','...o...','...o...'], {o:'#fffaf5'});

/* ---------- menu data: [name, line, spice 0-3, soup 0/1] ---------- */
const MENUS = {
  kor:{label:'한식', sub:'밥심 충전', say:'한식 땡겨!', items:[
    ["김치찌개","푹 익은 김치에 돼지고기 듬뿍. 밥 두 공기 각이다.",2,1],
    ["된장찌개","구수한 된장에 두부랑 애호박. 마음까지 따끈해진다.",1,1],
    ["제육볶음","매콤달콤 불맛 제육, 상추에 싸 먹자.",2,0],
    ["엽떡 마라","엽떡에 얼얼한 마라 한 스푼. 쿨피스 꼭 챙겨!",3,0],
    ["엽떡 로제","꾸덕한 로제 소스에 넓적당면 추가는 필수.",1,0],
    ["엽닭","엽기 닭볶음탕! 매콤한 국물에 밥 비벼 먹자.",2,1],
    ["닭찜","달달짭짤 간장 닭찜에 당면 듬뿍.",1,0],
    ["닭갈비","철판에 볶다가 마지막엔 볶음밥까지.",2,0],
    ["부대찌개","햄이랑 라면사리 넣고 보글보글.",2,1],
    ["칼국수","칸나 닭 칼국수 야르.",0,1],
    ["불닭","편의점 ㄱㄱ.",0,0],
    ["덮밥","밥 위에 뭐든 올리면 한 끼 완성!",0,0],
    ["치킨","후라이드 반, 양념 반. 무는 많이!",0,0],
  ]},
  wes:{label:'양식', sub:'파스타, 버거', say:'양식 먹고 싶어!', items:[
    ["까르보나라","꾸덕한 크림에 베이컨. 치즈는 듬뿍이다.",0,0],
    ["토마토 파스타","새콤한 토마토 소스에 바질 한 잎.",0,0],
    ["햄부기","두툼한 패티에 치즈 한 장. 감튀는 필수.",0,0],
    ["페퍼로니 피자","쭉 늘어나는 치즈! 한 조각 더 먹자.",1,0],
    ["함박스테이크","데미글라스 소스에 계란 프라이 올려서.",0,0],
    ["알리오 올리오","마늘 향 가득 깔끔한 오일 파스타.",1,0],
    ["샌드위치","바삭한 치킨에 소스 듬뿍. 한 입 크게.",0,0],
  ]},
  jpn:{label:'일식', sub:'스시, 라멘', say:'일식이 땡겨!', items:[
    ["초밥","연어, 광어, 새우… 접시 쌓아보자!",0,0],
    ["돈코츠 라멘","진한 돼지뼈 국물에 차슈 한 장.",0,1],
    ["돈카츠","겉바속촉 등심 돈카츠. 소스에 콕.",0,0],
    ["규동","달큰한 소고기 덮밥에 온천계란 올려.",0,0],
    ["우동","탱글한 면발에 따끈한 국물. 튀김 추가.",0,1],
    ["카레라이스","달큰한 일본식 카레에 돈카츠 토핑 어때?",1,0],
    ["차슈 덮밥","불향 입힌 차슈가 밥 위에 가득.",0,0],
    ["소바","따끈한 쯔유 국물에 메밀면 후루룩.",0,1],
  ]},
  chn:{label:'중식', sub:'짜장, 마라', say:'중식 가자!', items:[
    ["짜장면","짜장면은 언제 먹어도 진리다.",0,0],
    ["짬뽕","얼큰한 해물 국물. 땀 좀 흘려보자.",3,1],
    ["탕수육","부먹? 찍먹? 오늘은 네 마음대로.",0,0],
    ["마라탕","좋아하는 재료 골라 담기! 맵기 조절 필수.",3,1],
    ["새우볶음밥","고슬고슬 볶음밥에 짜장 소스 살짝.",0,0],
    ["마라샹궈","마라 레츠고.",2,0],
    ["딤섬","하가우, 샤오롱바오… 한 입에 쏙쏙.",0,0],
    ["우육면","진한 소고기 국물 국수. 든든하다.",1,1],
    ["lets HOTPOT","보글보글 훠궈! 홍탕 백탕 반반으로 가자.",0,1],
  ]},
};
const THINK = ['(골똘골똘…)','흠냐… 뭐가 좋을까','냉장고 뒤지는 중…','메뉴판 넘기는 중…','킁킁… 냄새 맡는 중','수염이 찌릿찌릿…'];

/* ---------- elements ---------- */
const catEl = $('cat'), cloudSub = $('cloudSub'), cloudMain = $('cloudMain'), bar = $('bar'),
      log = $('log'), pad = $('pad'), stage = $('stage'), fake = $('fake');
let eyes = 'open', busy = false, current = null;
const last = {};

function setCat(state){ eyes = state; catEl.innerHTML = px(catMap(state), CATPAL); }
function cloud(sub, main){ cloudSub.textContent = sub; cloudMain.textContent = main; }
$('miniCat').innerHTML = px(catMap('happy').slice(0, 14), CATPAL);
$('flowerBtn').innerHTML = FLOWER;
$('heartBtn').innerHTML = HEART;
bar.innerHTML = '<span></span>'.repeat(8);

function scroll(){ log.scrollTop = log.scrollHeight; }
function addMsg(html, who){
  const d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = html;
  log.appendChild(d); scroll(); return d;
}
async function catSay(html, wait = 650){
  const t = addMsg('', 'cat typing'); t.innerHTML = '<i></i><i></i><i></i>';
  await sleep(wait); t.remove(); return addMsg(html, 'cat');
}
function sparkle(){
  if (reduce) return;
  const r = catEl.getBoundingClientRect(), s = stage.getBoundingClientRect();
  for (let i = 0; i < 10; i++){
    const sp = document.createElement('span'); sp.className = 'spark';
    const a = (Math.PI * 2 * i) / 10, d = 60 + Math.random() * 30;
    sp.style.left = (r.left - s.left + r.width / 2) + 'px';
    sp.style.top = (r.top - s.top + r.height / 2.4) + 'px';
    sp.style.setProperty('--dx', Math.cos(a) * d + 'px');
    sp.style.setProperty('--dy', Math.sin(a) * d + 'px');
    sp.style.animation = `pop .9s steps(6) ${i * 20}ms forwards`;
    stage.appendChild(sp); setTimeout(() => sp.remove(), 1200);
  }
}

/* ---------- pads ---------- */
function showChoices(){
  pad.innerHTML = ''; pad.classList.remove('soup');
  for (const [key, m] of Object.entries(MENUS)){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn';
    b.innerHTML = `<span class="ico">${ICONS[key]}</span><span><b>${m.label}</b><small>${m.sub}</small></span>`;
    b.onclick = () => pick(key); pad.appendChild(b);
  }
  pad.hidden = false; fake.textContent = '> 뭐가 땡겨?';
  setTimeout(scroll, 30);
}
function showAfter(){
  pad.innerHTML = ''; pad.classList.remove('soup');
  const again = document.createElement('button'); again.type = 'button'; again.className = 'pbtn wide alt';
  again.textContent = '한 번 더 돌려줘';
  again.onclick = () => { addMsg('음… 다른 거 없어?', 'me'); spin(current.key, current.soup); };
  const other = document.createElement('button'); other.type = 'button'; other.className = 'pbtn wide';
  other.textContent = '다른 종류 고를래';
  other.onclick = async () => {
    pad.hidden = true; addMsg('다른 종류 볼래!', 'me');
    setCat('open'); cloud('(배고프다…)', '뭐 먹을래?');
    await catSay('좋아! 그럼 뭐가 땡겨?', 500); showChoices();
  };
  pad.append(again, other); pad.hidden = false; fake.textContent = '> 이거 먹을까…';
  setTimeout(scroll, 30);
}

/* ---------- game ---------- */
const SOUP = {
  yes: {label:'국물 있는 거', sub:'뜨끈하게 후루룩', say:'국물 있는 걸로!', word:'국물 있는 메뉴', tag:'국물 있음'},
  no:  {label:'국물 없는 거', sub:'볶고 굽고 튀기고', say:'국물은 없어도 돼!', word:'국물 없는 메뉴', tag:'국물 없음'},
  any: {label:'상관없어', sub:'모찌 마음대로', say:'아무거나 좋아!', word:'전체 메뉴', tag:null},
};
async function pick(key){
  if (busy) return;
  busy = true; pad.hidden = true;
  addMsg(MENUS[key].say, 'me');
  await sleep(300);
  await catSay(`${MENUS[key].label} 좋지! 국물은 어때?`, 550);
  busy = false; showSoup(key);
}
function showSoup(key){
  pad.innerHTML = '';
  for (const [s, o] of Object.entries(SOUP)){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn' + (s === 'any' ? ' span2' : '');
    b.innerHTML = `<span class="ico">${s === 'yes' ? SOUPICON : s === 'no' ? PLATEICON : ICONS[key]}</span><span><b>${o.label}</b><small>${o.sub}</small></span>`;
    b.onclick = async () => {
      if (busy) return;
      pad.hidden = true; addMsg(o.say, 'me'); await sleep(300); spin(key, s);
    };
    pad.appendChild(b);
  }
  pad.classList.add('soup'); pad.hidden = false; fake.textContent = '> 국물은…?';
  setTimeout(scroll, 30);
}

async function spin(key, soup = 'any'){
  busy = true; pad.hidden = true; current = {key, soup};
  const all = MENUS[key].items;
  let items = soup === 'any' ? all : all.filter(it => !!it[3] === (soup === 'yes'));
  const fallback = !items.length; if (fallback) items = all;
  const lk = key + '-' + soup;
  let idx; do { idx = Math.floor(Math.random() * items.length); } while (items.length > 1 && items[idx][0] === last[lk]);
  last[lk] = items[idx][0];
  const [name, line, spice, hasSoup] = items[idx];

  stage.classList.add('thinking'); setCat('closed');
  cloud(THINK[0], '…'); bar.hidden = false;
  const blocks = [...bar.children]; blocks.forEach(b => b.classList.remove('on'));
  fake.textContent = '> 모찌가 생각 중…';
  catSay(fallback
    ? `앗, ${MENUS[key].label}에는 아직 ${SOUP[soup].word}가 없어. 대신 ${MENUS[key].label} 전체에서 골라볼게!`
    : `음… 잠깐만, ${MENUS[key].label} ${SOUP[soup].word} 중에 골라볼게`, 450);

  // slot-machine roll inside the thought cloud, slowing down
  const steps = reduce ? 3 : 26; let t = 0, prev = -1;
  for (let i = 0; i < steps; i++){
    let r; do { r = Math.floor(Math.random() * items.length); } while (r === prev); prev = r;
    cloudMain.textContent = items[r][0];
    if (i % 5 === 0) cloudSub.textContent = THINK[(i / 5 + 1) % THINK.length | 0];
    const on = Math.min(blocks.length, Math.ceil(((i + 1) / steps) * blocks.length));
    blocks.forEach((b, j) => b.classList.toggle('on', j < on));
    const delay = 55 + Math.pow(i / steps, 2.6) * 340;
    t += delay; await sleep(delay);
  }
  cloudMain.textContent = name; cloudSub.textContent = '찾았다!';
  await sleep(380);

  stage.classList.remove('thinking'); setCat('happy'); bar.hidden = true; sparkle();
  const chili = '■'.repeat(spice) + '□'.repeat(3 - spice);
  await catSay(
    `<div class="result"><span class="eyebrow">today's pick</span><strong>${esc(name)}</strong>` +
    `<p>${esc(line)}</p><div class="meta"><span>맵기 ${chili}</span><span>${hasSoup ? '국물 있음' : '국물 없음'}</span><span>후보 ${items.length}개 중 1개</span></div></div>`, 500);
  busy = false; showAfter();
}

async function pet(){
  if (busy) return;
  const prev = eyes, s = cloudSub.textContent, m = cloudMain.textContent;
  busy = true; setCat('happy'); cloud('(쓰담쓰담)', '골골골… ♥'); sparkle();
  await sleep(1300);
  setCat(prev === 'closed' ? 'open' : prev); cloud(s, m); busy = false;
}
catEl.onclick = pet;
$('heartBtn').onclick = pet;
$('flowerBtn').onclick = async () => {
  if (busy) return;
  log.innerHTML = ''; pad.hidden = true; intro();
};

// idle blink
setInterval(async () => {
  if (eyes !== 'open' || busy) return;
  setCat('closed'); await sleep(140); if (eyes === 'closed' && !busy) setCat('open');
}, 3400);

/* ---------- background decor ---------- */
const decor = $('decor');
const spots = [[6,8,'f'],[90,12,'s'],[12,40,'s'],[94,46,'f'],[4,78,'f'],[88,84,'s'],[20,94,'s'],[78,30,'s'],[50,4,'s'],[70,96,'f']];
spots.forEach(([x, y, k]) => {
  const i = document.createElement('i'); i.style.left = x + '%'; i.style.top = y + '%';
  i.innerHTML = k === 'f' ? FLOWER : SPARK; decor.appendChild(i);
});

async function intro(){
  busy = true; setCat('open'); cloud('(배고프다…)', '손님이다!');
  fake.textContent = '> 모찌가 입력 중…';
  await catSay('어서 와! 나는 메뉴 고르는 고양이 <b>모찌</b>야.', 700);
  await catSay('오늘은 뭐가 땡겨? 아래에서 골라줘 ▼', 700);
  cloud('(꼬리 살랑살랑)', '뭐 먹을래?');
  busy = false; showChoices();
}
/* ---------- host control ---------- */
const KEYS = Object.keys(MENUS);
const DEFAULTS = Object.fromEntries(KEYS.map(k => [k, MENUS[k].items.map(it => it.slice())]));
const hostEl = $('host'), screenEl = $('screen'), hostBtn = $('hostBtn'), rowsEl = $('rows'), tabsEl = $('tabs'),
      noteEl = $('hostNote'), confirmEl = $('confirm');
let draft = null, tab = 'kor', menuDoc = null, hostOpen = false;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clean(list){
  if (!Array.isArray(list)) return null;
  const out = list.map(it => [String(it?.n ?? '').trim().slice(0, 30), String(it?.l ?? '').trim().slice(0, 80),
    Math.max(0, Math.min(3, parseInt(it?.s, 10) || 0)), it?.g ? 1 : 0]).filter(it => it[0]);
  return out.length ? out : null;
}
function applyMenus(menus){
  if (!menus || typeof menus !== 'object') return;
  KEYS.forEach(k => { const c = clean(menus[k]); if (c){ MENUS[k].items = c; delete last[k]; } });
}

function renderTabs(){
  tabsEl.innerHTML = '';
  KEYS.forEach(k => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(k === tab));
    b.innerHTML = `${MENUS[k].label}<small>${draft[k].length}</small>`;
    b.onclick = () => { tab = k; confirmEl.hidden = true; renderTabs(); renderRows(); };
    tabsEl.appendChild(b);
  });
  const y = draft[tab].filter(it => it[3]).length;
  $('tabInfo').textContent = `${MENUS[tab].label}: 국물 있음 ${y}개 · 국물 없음 ${draft[tab].length - y}개`;
}
function renderRows(){
  rowsEl.innerHTML = '';
  draft[tab].forEach((it, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('input'); name.id = `n-${tab}-${i}`; name.value = it[0]; name.placeholder = '메뉴 이름'; name.maxLength = 30;
    name.setAttribute('aria-label', '메뉴 이름');
    name.oninput = () => { it[0] = name.value; };
    const sp = document.createElement('select'); sp.id = `s-${tab}-${i}`; sp.setAttribute('aria-label', '맵기');
    [0,1,2,3].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = '■'.repeat(v) + '□'.repeat(3 - v); sp.appendChild(o); });
    sp.value = it[2]; sp.onchange = () => { it[2] = +sp.value; };
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '×';
    del.setAttribute('aria-label', (it[0] || '이 메뉴') + ' 지우기');
    del.onclick = () => { draft[tab].splice(i, 1); renderTabs(); renderRows(); };
    const soupL = document.createElement('label'); soupL.className = 'souptg';
    const soupC = document.createElement('input'); soupC.type = 'checkbox'; soupC.id = `g-${tab}-${i}`; soupC.checked = !!it[3];
    soupC.onchange = () => { it[3] = soupC.checked ? 1 : 0; renderTabs(); };
    soupL.append(soupC, document.createTextNode('국물'));
    const line = document.createElement('input'); line.id = `l-${tab}-${i}`; line.className = 'line'; line.value = it[1];
    line.placeholder = '모찌의 한마디 (선택)'; line.maxLength = 80; line.setAttribute('aria-label', '모찌의 한마디');
    line.oninput = () => { it[1] = line.value; };
    row.append(name, sp, soupL, del, line); rowsEl.appendChild(row);
  });
}
function openHost(){
  if (busy) return;
  draft = Object.fromEntries(KEYS.map(k => [k, MENUS[k].items.map(it => it.slice())]));
  hostOpen = true; hostEl.hidden = false; screenEl.hidden = true; confirmEl.hidden = true;
  hostBtn.setAttribute('aria-pressed', 'true'); noteEl.textContent = '';
  renderTabs(); renderRows();
}
function closeHost(){
  hostOpen = false; hostEl.hidden = true; screenEl.hidden = false; hostBtn.setAttribute('aria-pressed', 'false');
  scroll();
}
hostBtn.onclick = () => hostOpen ? closeHost() : openHost();
$('closeBtn').onclick = closeHost;
$('addBtn').onclick = () => {
  draft[tab].push(['', '', 0, 0]); renderTabs(); renderRows();
  const inputs = rowsEl.querySelectorAll('.row input:not(.line)'); inputs[inputs.length - 1]?.focus();
  rowsEl.scrollTop = rowsEl.scrollHeight;
};
$('resetBtn').onclick = () => { confirmEl.hidden = false; };
$('resetNo').onclick = () => { confirmEl.hidden = true; };
$('resetYes').onclick = () => {
  draft[tab] = DEFAULTS[tab].map(it => it.slice()); confirmEl.hidden = true;
  noteEl.textContent = `${MENUS[tab].label}을 기본 메뉴로 되돌렸어요. 저장을 눌러야 적용돼요.`;
  renderTabs(); renderRows();
};
$('saveBtn').onclick = async () => {
  const out = {};
  for (const k of KEYS){
    const list = draft[k].map(it => ({n: it[0].trim(), l: it[1].trim(), s: it[2], g: !!it[3]})).filter(it => it.n);
    if (!list.length){ tab = k; renderTabs(); renderRows(); noteEl.textContent = `${MENUS[k].label}에 메뉴가 하나는 있어야 해요.`; return; }
    out[k] = list;
  }
  applyMenus(out);
  const btn = $('saveBtn'); btn.disabled = true;
  if (!menuDoc){
    noteEl.textContent = '이 화면에만 적용됐어요. 모두에게 저장하려면 로그인해서 열어주세요.';
    btn.disabled = false; return;
  }
  noteEl.textContent = '저장 중…';
  try {
    await menuDoc.set({menus: out, updatedAt: new Date().toISOString()});
    noteEl.textContent = '저장했어요! 이제 모찌가 새 메뉴로 추천해요.';
  } catch (e) {
    noteEl.textContent = '저장하지 못했어요. 이 링크의 편집 권한이 있는지 확인해 주세요.';
  }
  btn.disabled = false;
};

// connect: shared menu lives in db at config/menu; only editors see the host button
(async () => {
  const user = await window.claude?.use?.('user');
  if (user && await user.canEdit()) hostBtn.hidden = false;
  hostBtn.setAttribute('aria-pressed', 'false');
  const db = await window.claude?.use?.('db');
  if (!db) return;
  menuDoc = db.doc('config/menu');
  menuDoc.onSnapshot(snap => {
    if (snap.exists) applyMenus(snap.data()?.menus);
  }, () => {});
})().catch(() => {});

intro();
})();
</script>
